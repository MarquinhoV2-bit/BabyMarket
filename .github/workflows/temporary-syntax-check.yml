name: Temporary syntax diagnosis

on:
  push:
    branches:
      - feature/cart-push-animation-physics
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse main module without executing it
        run: node --input-type=module --check < src/main.js
