name: BabyMarket push animation syntax validation

on:
  push:
    branches:
      - feature/cart-push-animation-physics

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --input-type=module --check < src/main.js
