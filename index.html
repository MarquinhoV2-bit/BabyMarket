<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>BabyMarket — Protótipo 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #cdeafe;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
    }
    #ui-screen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      background: linear-gradient(160deg, rgba(7,16,34,.86), rgba(17,24,39,.74));
      color: #fff;
    }
    #ui-title {
      margin: 0;
      max-width: 95vw;
      color: #fff;
      font-size: clamp(29px, 7vw, 46px);
      font-weight: 900;
      letter-spacing: .025em;
      line-height: 1.1;
      text-shadow: 0 3px 14px rgba(0,0,0,.5);
    }
    #ui-subtitle {
      max-width: 520px;
      margin: 0 0 10px;
      padding: 0 12px;
      color: #dbeafe;
      font-size: 15px;
      line-height: 1.5;
    }
    #load-error {
      display: none;
      max-width: 480px;
      padding: 0 16px;
      color: #fecaca;
      font-size: 13px;
    }
    #ui-btn {
      min-width: 200px;
      border: 0;
      border-radius: 14px;
      padding: 14px 24px;
      color: #1f2937;
      background: linear-gradient(180deg, #fbbf24, #f59e0b);
      font-size: 17px;
      font-weight: 850;
      box-shadow: 0 6px 0 #b45309, 0 12px 24px rgba(0,0,0,.25);
    }
    #ui-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #b45309; }
    #ui-btn:disabled { cursor: wait; filter: grayscale(.5); opacity: .65; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui-screen" role="status" aria-live="polite">
    <h1 id="ui-title">CARREGANDO SUPERMERCADO...</h1>
    <button id="ui-btn" disabled>CARREGANDO...</button>
  </div>
  <script type="module" src="./src/main.js?v=7"></script>
</body>
</html>
